name: Package checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Validation only: no publishing, deployment credentials or write permissions.
permissions:
  contents: read

concurrency:
  group: package-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build ruff==0.17.3 packaging
      - run: ruff format --check src/openhisto scripts
      - run: ruff check src/openhisto scripts
      - run: python -m build
      - run: python scripts/check-distribution.py dist/*.whl dist/*.tar.gz

  synthetic-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the shared CPU Torch baseline
        run: python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install the composed workflows
        run: >-
          python -m pip install -e
          ".[patch-extraction-opencv,default-datasets,feature-encoder-local,feature-encoder-google,feature-encoder-cohere,feature-encoder-aws,stain-transfer-gan,stain-transfer-spams,segmentation-transformers,mil-backbones,mil-classical-all]"
      - name: Install the pinned SAM2 CPU source
        env:
          SAM2_BUILD_CUDA: "0"
        run: |
          python -m pip install setuptools wheel
          python -m pip install --no-build-isolation -r src/openhisto/segmentation/requirements-sam2.txt
          python -c 'from training.model.sam2 import SAM2Train'
      - run: python -m pip check
      - name: Run synthetic workflow tests
        run: |
          for package in default_datasets patch_extraction feature_encoder stain_transfer segmentation vlas; do
            python -m unittest discover -s "src/openhisto/$package/tests" -t src -v
          done
      - name: Validate all MIL backbones and task heads
        run: |
          python -m openhisto.mil.models.code_bases.validate
          python -m openhisto.mil.heads.validate

  linux-container:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Apptainer from its official Ubuntu PPA
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer
      - name: Build the CPU smoke image and run its test section
        run: >-
          sudo apptainer build
          --build-arg TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu
          /tmp/stain-transfer.sif
          src/openhisto/stain_transfer/Singularityfile.def
      - name: Check the container runscript
        run: apptainer run /tmp/stain-transfer.sif methods
