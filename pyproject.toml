[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "OpenHisto"
dynamic = ["version"]
description = "Computational pathology tools from whole-slide images to slide-level models."
keywords = ["computational pathology", "histology", "whole-slide imaging", "multiple-instance learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
readme = "README.md"
authors = [{name = "Abteen Arab"}]
maintainers = [{name = "Abteen Arab"}]
license = "MIT"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "src/openhisto/stain_transfer/CLASSICAL_LICENSE.txt",
    "src/openhisto/stain_transfer/licenses/*.txt",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10",
    "h5py>=3.9",
]

[project.urls]
Repository = "https://github.com/OpenHist/OpenHistology_Package"
Documentation = "https://github.com/OpenHist/OpenHistology_Package/blob/main/README.md"
Issues = "https://github.com/OpenHist/OpenHistology_Package/issues"

# Extras compose: a variant such as feature-encoder-local includes feature-encoder.
# Torch workflows share the tested 2.6 / torchvision 0.21 compatibility line.
# Exact reference environments remain in the requirements-tested.lock.txt files.
[project.optional-dependencies]
patch-extraction = [
    "numpy>=1.26",
    "Pillow>=10",
    "h5py>=3.10",
    # openslide-bin ships the native library; a system OpenSlide works instead.
    "openslide-python>=1.4",
    "openslide-bin>=4.0",
    "scikit-image>=0.22,<1",
    "tifffile>=2023.9.26",
]
# Choose this on a fresh environment. Existing cv2 installations can instead use
# patch-extraction without installing a second OpenCV distribution.
patch-extraction-opencv = [
    "openhisto[patch-extraction]",
    "opencv-python-headless>=4.10,<5",
]

feature-encoder = [
    "anndata==0.13.3.post0",
    "numpy==2.2.6",
    "pandas==3.1.0",
    "h5py==3.13.0",
    "Pillow>=10",
]
feature-encoder-local = [
    "openhisto[feature-encoder]",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "transformers>=4.51,<5",
    "timm>=1.0.12,<2",
    "huggingface-hub>=0.31,<2",
    "safetensors>=0.4.5",
    "einops>=0.8",
    "einops-exts>=0.0.4",
    "requests>=2.31",
]
feature-encoder-google = ["openhisto[feature-encoder]", "google-genai==2.33.0"]
feature-encoder-cohere = ["openhisto[feature-encoder]", "cohere==7.3.0"]
feature-encoder-aws = ["openhisto[feature-encoder]", "boto3==1.43.119"]

default-datasets = [
    "requests>=2.31",
    "openpyxl>=3.1",
]

stain-transfer = [
    "numpy>=1.26,<3",
    "Pillow>=10,<13",
    "h5py>=3.10,<4",
    # Classical LAB and brightness operations.
    "opencv-python-headless>=4.10,<5",
]
# Select the CPU/CUDA torch wheel that matches the deployment.
stain-transfer-gan = ["openhisto[stain-transfer]", "torch>=2.6,<2.7"]
# Import name: spams. Required by Vahadane and Macenko only.
stain-transfer-spams = ["openhisto[stain-transfer]", "spams-bin==2.6.14"]

# Model backends run in their own interpreters; see the requirements-*.txt
# worker environments in src/openhisto/vlas/.
vlas = [
    "numpy>=1.24,<3",
    "Pillow>=10,<12",
    "h5py>=3.9,<4",
]

segmentation = [
    "numpy>=1.24",
    "Pillow>=10",
    "scipy>=1.10",
    "tifffile>=2023.7",
    "h5py>=3.9",
    "shapely>=2",
]
segmentation-torch = [
    "openhisto[segmentation]",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
]
segmentation-transformers = [
    "openhisto[segmentation-torch]",
    "transformers==4.52.4",
    "safetensors>=0.4",
]
# network_style=mamba additionally needs a CUDA build of mamba-ssm, installed
# following its official guide. Legacy feature files need h5py.
segmentation-segdiff = ["openhisto[segmentation-torch]", "h5py>=3.10"]
# Install the pinned SAM 2 source separately using requirements-sam2.txt.
# Direct URLs cannot appear in metadata uploaded to PyPI.
segmentation-sam2 = [
    "openhisto[segmentation-torch]",
]

# Backbones, neural classification heads and survival heads.
mil = [
    "torch>=2.6,<2.7",
    "numpy==2.2.6",
]
mil-attention = [
    "openhisto[mil]",
    "timm==1.0.12",
    "torchvision>=0.21,<0.22",
    "einops==0.8.2",
    "scipy==1.14.1",
    "scikit-learn==1.5.2",
]
mil-transformers = [
    "openhisto[mil-attention]",
    "nystrom-attention==0.0.14",
    "omegaconf==2.3.0",
    "hydra-core==1.3.2",
]
mil-graph-multiscale = [
    "openhisto[mil-attention]",
    "torch-geometric==2.6.1",
    "nystrom-attention==0.0.14",
    "admin-torch==0.1.0",
    "h5py==3.13.0",
    "pandas==3.1.0",
    "omegaconf==2.3.0",
    "hydra-core==1.3.2",
]
mil-backbones = ["openhisto[mil-attention,mil-transformers,mil-graph-multiscale]"]
# CPU classifiers with restricted sklearn persistence. For serial (OpenMP-free)
# XGBoost/LightGBM builds, see src/openhisto/mil/classification/install_serial_boosting.sh.
mil-classical = [
    "numpy>=2.2,<3",
    "scipy>=1.14,<2",
    "scikit-learn==1.5.2",
    "skops==0.16.0",
    "threadpoolctl>=3,<4",
]
mil-classical-xgboost = ["openhisto[mil-classical]", "xgboost==3.4.1"]
mil-classical-lightgbm = ["openhisto[mil-classical]", "lightgbm==4.7.0"]
mil-classical-catboost = ["openhisto[mil-classical]", "catboost==1.2.10"]
mil-classical-all = ["openhisto[mil-classical-xgboost,mil-classical-lightgbm,mil-classical-catboost]"]

[tool.hatch.version]
path = "src/openhisto/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openhisto"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/scripts",
    "/.github",
    "/.gitignore",
    "/README.md",
    "/CONTRIBUTING.md",
    "/THIRD_PARTY_NOTICES.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "src/openhisto/mil/models/code_bases/upstream",
    # Copied third-party definitions retain their upstream layout and notices.
    "src/openhisto/stain_transfer/networks",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Compatibility re-exports used by callers of these configuration modules.
"src/openhisto/feature_encoder/config.py" = ["F401"]
"src/openhisto/vlas/config.py" = ["F401"]
